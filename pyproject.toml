[project]
name = "langchain-agent-rebuild"
version = "0.1.0"
description = "Project H: rebuild of the Project G ReAct agent with LangChain, plus a fair comparison."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "langchain>=1.0",
  "langchain-ollama",
  "langgraph",
  "pydantic>=2",
  "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
